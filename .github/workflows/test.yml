# ============================================================================
# 정산 엔진 회귀 테스트 자동 실행 (GitHub Actions)
#
# 목적: test/engine.test.js 의 회귀 테스트를 push/PR 때마다 자동으로 돌려서,
#       core-rules.md(개발 헌법)의 계산 규칙이 깨진 채로 배포되는 걸 막는다.
#       로컬에서 `npm test` 돌리는 걸 깜빡해도 GitHub이 대신 잡아준다.
#
# 결과 확인: GitHub 저장소 > 상단 [Actions] 탭. 실패하면 커밋 옆에 ❌ 가 붙고
#           등록된 메일로 알림이 온다.
#
# 이 앱은 빌드도 의존성 설치도 필요 없는 정적 웹앱이라 `npm install` 단계가 없다.
# (package.json 의 scripts.test 는 Node 내장 테스트 러너만 사용)
# ============================================================================
name: 정산 엔진 테스트

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:   # [Actions] 탭에서 수동 실행도 가능하게

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # node --test 내장 러너는 Node 18 이상 필요

      - name: 회귀 테스트 실행
        run: npm test

      # 퍼즈 테스트: 무작위 시나리오 2,000건을 돌려 "어떤 경우에도 참이어야 하는 성질"(불변식)을
      # 검사한다. 회귀 테스트가 '사람이 미리 생각해낸 경우'만 본다면 이쪽은 생각 못 한 조합을 본다.
      # 시나리오는 seed 기반이라 매번 같은 2,000건이 돌아간다(랜덤하게 붙었다 떨어졌다 하지 않음).
      # ❗여기서 실패하면, 보고된 seed를 `node test/fuzz-engine.js --seed <번호>`로 로컬에서
      #   그대로 재현해 원인을 확인할 수 있다.
      - name: 퍼즈 테스트 실행 (불변식 검사)
        run: npm run fuzz -- 2000
